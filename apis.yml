aid: northwestern-mutual
name: "Northwestern Mutual"
specificationVersion: '0.23'
description: >-
  Northwestern Mutual is a Milwaukee-based Fortune 500 mutual insurance and financial
  services company founded in 1857, providing life insurance, disability income insurance,
  long-term care insurance, annuities, investment products, brokerage and wealth management
  services to individuals, families and businesses through a nationwide network of financial
  advisors. The company operates a large internal API estate — domain and experience APIs
  behind an API gateway, with GraphQL used to harmonize them — but publishes no public
  developer program, API documentation or machine-readable contract; its public engineering
  presence is an open source GitHub organization and a Bugcrowd-managed responsible
  disclosure program.
