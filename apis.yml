  reason: no-developer-program
  detail: >-
    Northwestern Mutual runs a large internal API estate — domain and experience APIs behind
    a governed gateway, harmonized with GraphQL, described only in third-party vendor case
    studies — but exposes none of it publicly: there is no developer.* or api.* DNS record at
    all, and every spec path on the corporate host (/openapi.json, /swagger.json, /api-docs,
    /graphql, /llms.txt) returns the site's 404 page.
